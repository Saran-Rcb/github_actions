name: Python CI

on:
  push:
    branches:
      - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Build project
        run: |
          mkdir build
          cp calculator.py build/
          cp test_calculator.py build/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/